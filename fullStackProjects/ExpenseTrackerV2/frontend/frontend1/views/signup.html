<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | ExpenseFlow</title>
    <meta
      name="description"
      content="Create your free ExpenseFlow account and let AI categorize your expenses automatically."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/signup.css" />
  </head>

  <body>
    <!-- ================= Navigation ================= -->
    <nav class="navbar">
      <a href="home.html" class="logo" aria-label="ExpenseFlow home">
        <span class="logo-mark" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </span>
        ExpenseFlow
      </a>

      <a href="home.html" class="home-link">← Back to home</a>
    </nav>

    <!-- ================= Signup ================= -->
    <main class="main-container">
      <section class="signup-card" aria-labelledby="signup-title">
        <div class="signup-icon" aria-hidden="true">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="3.6" />
            <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
          </svg>
        </div>

        <h1 id="signup-title">Create your account</h1>

        <p class="subtitle">
          Join ExpenseFlow and let AI organize your spending from day one.
        </p>

        <form onsubmit="formSubmit(event)">
          <div class="form-group">
            <label for="name">Full name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone number</label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter your 10-digit mobile number"
              autocomplete="tel"
              inputmode="numeric"
              pattern="[6-9][0-9]{9}"
              maxlength="10"
              title="Enter a valid 10-digit Indian mobile number"
              required
            />

            <span class="input-hint">
              Enter your 10-digit Indian mobile number.
            </span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                minlength="8"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
                aria-controls="password"
              >
                Show
              </button>
            </div>

            <span class="input-hint">
              Password must contain at least 8 characters.
            </span>
          </div>

          <button type="submit" class="signup-btn">
            Create account
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>

          <p id="responseMessage" role="status" aria-live="polite"></p>
        </form>

        <p class="login-link">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </section>
    </main>

    <footer>© 2026 ExpenseFlow. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/signup.js"></script>

    <script>
      // Toggle password visibility (no effect on signup logic)
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "Hide" : "Show";
        togglePassword.setAttribute(
          "aria-label",
          isPassword ? "Hide password" : "Show password",
        );
      });
    </script>
  </body>
</html>
