<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | ExpenseFlow</title>
    <meta
      name="description"
      content="Sign in to ExpenseFlow to track expenses, manage your categories and view your spending insights."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <!-- ================= Navigation ================= -->
    <nav class="navbar">
      <a href="home.html" class="logo" aria-label="ExpenseFlow home">
        <span class="logo-mark" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </span>
        ExpenseFlow
      </a>

      <a href="home.html" class="home-link">← Back to home</a>
    </nav>

    <!-- ================= Login ================= -->
    <main class="main-container">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-icon" aria-hidden="true">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="10" width="16" height="11" rx="2.5" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="15.5" r="1.4" />
          </svg>
        </div>

        <h1 id="login-title">Welcome back</h1>

        <p class="subtitle">
          Sign in to your account to keep your expenses organized and up to
          date.
        </p>

        <form onsubmit="formSubmit(event)">
          <div class="form-group">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
                aria-controls="password"
              >
                Show
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn">
            Login to account
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>

          <p id="responseMessage" role="status" aria-live="polite"></p>
        </form>

        <!-- Forgot password (below the form) -->
        <p class="forgot-link">
          <a href="forgot-password.html">Forgot your password?</a>
        </p>

        <p class="signup-link">
          Don't have an account?
          <a href="signup.html">Create an account</a>
        </p>
      </section>
    </main>

    <footer>© 2026 ExpenseFlow. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/login.js"></script>

    <script>
      // Toggle password visibility (no effect on login logic)
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.textContent = isPassword ? "Hide" : "Show";
        togglePassword.setAttribute(
          "aria-label",
          isPassword ? "Hide password" : "Show password",
        );
      });
    </script>
  </body>
</html>
