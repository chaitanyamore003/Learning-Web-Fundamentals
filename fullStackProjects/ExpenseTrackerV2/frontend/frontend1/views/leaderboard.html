<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ExpenseFlow | Leaderboard</title>
    <meta
      name="description"
      content="See how your spending compares. The ExpenseFlow leaderboard ranks premium members by all-time total expenses."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/leaderboard.css" />
  </head>

  <body>
    <!-- ================= Header ================= -->
    <header class="site-header">
      <nav class="navbar">
        <a href="home.html" class="logo" aria-label="ExpenseFlow home">
          <span class="logo-mark" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
          </span>
          ExpenseFlow
        </a>

        <button
          type="button"
          id="backBtn"
          class="nav-btn"
          onclick="window.location.href = 'dashboard.html'"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5M11 18l-6-6 6-6" />
          </svg>
          Dashboard
        </button>
      </nav>
    </header>

    <!-- ================= Page ================= -->
    <main class="container">
      <header class="page-heading">
        <div class="trophy" aria-hidden="true">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 21h8M12 17v4" />
            <path d="M7 4h10v4a5 5 0 0 1-10 0z" />
            <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" />
          </svg>
        </div>

        <div class="heading-text">
          <p class="eyebrow">
            Premium
            <span class="badge-pro">Pro</span>
          </p>
          <h1>Expense leaderboard</h1>
          <p class="subtitle">Ranked by all-time total expenses</p>
        </div>
      </header>

      <section class="leaderboard-card" aria-labelledby="board-title">
        <div class="card-head">
          <h2 id="board-title">Top spenders</h2>
          <span class="badge-soft">All time</span>
        </div>

        <div class="leaderboard-header" aria-hidden="true">
          <span>Rank</span>
          <span>User</span>
          <span class="col-right">Total expense</span>
        </div>

        <div id="leaderboard">
          <p id="message">Loading leaderboard…</p>
        </div>
      </section>
    </main>

    <footer>© 2026 ExpenseFlow. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/leaderboard.js"></script>
  </body>
</html>
