<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | ExpenseFlow</title>
    <meta
      name="description"
      content="Reset your ExpenseFlow password. Enter your email and we'll send you a secure reset link."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>

  <body>
    <!-- ================= Navigation ================= -->
    <nav class="navbar">
      <a href="home.html" class="logo" aria-label="ExpenseFlow home">
        <span class="logo-mark" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </span>
        ExpenseFlow
      </a>

      <a href="login.html" class="home-link">← Back to login</a>
    </nav>

    <!-- ================= Forgot password ================= -->
    <main class="main-container">
      <section class="forgot-card" aria-labelledby="forgot-title">
        <div class="forgot-icon" aria-hidden="true">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2.5" />
            <path d="m3.5 7 8.5 6 8.5-6" />
          </svg>
        </div>

        <h1 id="forgot-title">Reset your password</h1>

        <p class="subtitle">
          Enter the email address linked to your account and we'll send you a
          secure link to reset your password.
        </p>

        <form onsubmit="formSubmit(event)" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
            />
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Send reset link
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>

          <p id="responseMessage" role="status" aria-live="polite"></p>
        </form>

        <p class="login-link">
          Remembered your password?
          <a href="login.html">Back to login</a>
        </p>
      </section>
    </main>

    <footer>© 2026 ExpenseFlow. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/forgot-password.js"></script>
  </body>
</html>
