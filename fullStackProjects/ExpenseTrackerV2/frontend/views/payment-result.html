<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ExpenseFlow | Payment Result</title>
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/payment-result.css" />
  </head>

  <body>
    <main class="result-wrapper">
      <a href="home.html" class="logo" aria-label="ExpenseFlow home">
        <span class="logo-mark" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </span>
        ExpenseFlow
      </a>

      <section class="result-card" aria-labelledby="resultTitle">
        <!-- Status icon: the visible variant switches with the message state -->
        <div class="status-icon" aria-hidden="true">
          <!-- Waiting / verifying -->
          <svg
            class="ic ic-wait"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5V12l3 1.8" />
          </svg>

          <!-- Success -->
          <svg
            class="ic ic-success"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>

          <!-- Error / failed -->
          <svg
            class="ic ic-error"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 8v5" />
            <circle
              cx="12"
              cy="16.5"
              r="0.9"
              fill="currentColor"
              stroke="none"
            />
            <circle cx="12" cy="12" r="9" />
          </svg>
        </div>

        <h2 id="resultTitle">Verifying your payment…</h2>

        <p id="paymentMessage">Please wait while we verify your transaction.</p>

        <p id="countdown" hidden>
          Redirecting to login in <span id="timer">5</span> seconds…
        </p>

        <button
          id="dashboardBtn"
          class="btn-primary"
          hidden
          onclick="window.location.href = 'expense.html'"
        >
          Go to dashboard
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>

        <div class="secure-note">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="10" width="16" height="11" rx="2.5" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          <span>Secured by Cashfree Payments</span>
        </div>
      </section>

      <p class="fineprint">
        Need help? Contact support from your
        <a href="dashboard.html">dashboard</a>.
      </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/payment-result.js"></script>
  </body>
</html>
