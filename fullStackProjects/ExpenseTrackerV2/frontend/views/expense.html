<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Expenses</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        padding: 40px 15px;
        background-color: #f4f6f9;
      }

      .formContainer {
        width: 100%;
        max-width: 500px;
        margin: auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      .listContainer {
        width: 100%;
        max-width: 1000px;
        margin: 50px auto 0;
        padding: 30px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-bottom: 25px;
        color: #222;
        text-align: center;
      }

      /* Expense Form */

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #2563eb;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      /* Buttons */

      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }

      .submit-btn {
        width: 100%;
        padding: 13px;
        background-color: #2563eb;
        color: white;
        font-size: 16px;
      }

      .submit-btn:hover {
        background-color: #1d4ed8;
      }

      .edit-btn {
        background-color: #f59e0b;
        color: white;
      }

      .delete-btn {
        background-color: #dc2626;
        color: white;
      }

      /* Response Message */

      #responseMessage {
        margin-top: 12px;
        text-align: center;
      }

      /* Expense List */

      .expense-list {
        margin-top: 35px;
      }

      .expense-list h2 {
        font-family: "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        margin-bottom: 18px;
      }

      #expensesContainer {
        padding: 0;
        list-style: none;
      }

      .expense-details {
        flex: 1;
        font-size: 16px;
        color: #333;
        font-weight: 500;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      .expense-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 12px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .empty-message {
        padding: 15px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="formContainer">
      <h2>Add Expense</h2>

      <form id="expenseForm" onsubmit="addExpense(event)">
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" hidden>Select Category</option>
            <option value="Food">Food</option>
            <option value="Petrol">Petrol</option>
            <option value="Salary">Salary</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Enter expense description..."
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">Add Expense</button>

        <p id="responseMessage"></p>
      </form>
    </div>
    <!-- Expense List -->
    <div class="listContainer">
      <div class="expense-list">
        <h2>My Expenses</h2>

        <ul id="expensesContainer"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/expense.js"></script>
  </body>
</html>
