<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpenseFlow | Leaderboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: #0b1020;
        color: #f1f5f9;
        padding: 40px 20px;
      }

      .container {
        max-width: 850px;
        margin: auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 35px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #94a3b8;
        font-size: 14px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 11px 16px;
        background: #7c3aed;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #6d28d9;
      }

      .leaderboard-card {
        background: #151c30;
        border: 1px solid #27324b;
        border-radius: 14px;
        padding: 24px;
      }

      .leaderboard-card h2 {
        font-size: 19px;
        margin-bottom: 22px;
      }

      .leaderboard-header,
      .leaderboard-row {
        display: grid;
        grid-template-columns: 80px 1fr 160px;
        align-items: center;
        gap: 12px;
        padding: 16px;
      }

      .leaderboard-header {
        color: #94a3b8;
        font-size: 13px;
        border-bottom: 1px solid #27324b;
      }

      .leaderboard-row {
        border-bottom: 1px solid #27324b;
      }

      .leaderboard-row:last-child {
        border-bottom: none;
      }

      .rank {
        font-weight: bold;
        color: #a78bfa;
      }

      .user-name {
        font-weight: 600;
      }

      .total-expense {
        text-align: right;
        font-weight: bold;
        color: #34d399;
      }

      #message {
        color: #94a3b8;
        text-align: center;
        padding: 25px 10px;
      }

      .error {
        color: #f87171 !important;
      }

      @media (max-width: 550px) {
        body {
          padding: 25px 12px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .leaderboard-card {
          padding: 14px;
        }

        .leaderboard-header,
        .leaderboard-row {
          grid-template-columns: 45px 1fr 110px;
          gap: 8px;
          padding: 13px 6px;
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <header>
        <div>
          <h1>🏆 Expense Leaderboard</h1>
          <p class="subtitle">Ranked by all-time total expenses</p>
        </div>

        <button id="backBtn" onclick="window.location.href = 'expense.html'">
          ← Dashboard
        </button>
      </header>

      <section class="leaderboard-card">
        <h2>Top Spenders</h2>

        <div class="leaderboard-header">
          <span>Rank</span>
          <span>User</span>
          <span style="text-align: right">Total Expense</span>
        </div>

        <div id="leaderboard">
          <p id="message">Loading leaderboard...</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/leaderboard.js"></script>
  </body>
</html>
