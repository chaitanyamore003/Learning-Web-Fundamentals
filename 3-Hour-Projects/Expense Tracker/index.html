<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <h1 id="heading">Modern way of tracking your expense</h1>
    <hr />
    <!--Input fields for adding expenses -->
    <form id="inputForm" onsubmit="addExpense(event)">
      <label for="expenseName">Expense Name:</label>
      <input type="text" id="expenseName" placeholder="Expense Name" required />
      <label for="expenseAmount">Amount:</label>
      <input type="number" id="expenseAmount" placeholder="Amount" required />
      <label for="chooseCategory">Choose Category:</label>
      <select id="chooseCategory">
        <option hidden>Choose Category</option>
        <option value="movie">movie</option>
        <option value="fuel">fuel</option>
        <option value="shopping">shopping</option>
        <option value="food">food</option>
        <option value="travel">travel</option>
      </select>
      <button type="submit" id="submitBtn">Add Expense</button>
    </form>
    <hr />
    <ul id="expenseList"></ul>
  </body>
  <script src="index.js"></script>
</html>
